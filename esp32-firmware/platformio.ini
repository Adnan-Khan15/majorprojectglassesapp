; Smart assistive glasses — Seeed XIAO ESP32S3 Sense firmware
;
;   pio run -t upload -t monitor     build + flash + serial monitor (115200)
;   pio test -e native               host tests of lib/glasses_core (ADPCM, CRC32, ToF filter, frames)

[env:xiao_esp32s3]
; Pinned: this platform ships Arduino-ESP32 core 2.0.17 (ESP-IDF 4.4). The audio code
; uses the legacy driver/i2s.h API (PDM RX on I2S0 + standard TX on I2S1), which
; core 3.x replaced; don't bump without porting src/speaker.cpp and src/mic.cpp.
platform = espressif32@7.1.3
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
board_build.arduino.memory_type = qio_opi
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0
    pololu/VL53L0X@^1.3.1
test_ignore = *

[env:native]
platform = native
build_flags = -std=c++17 -Wall
test_build_src = no
lib_compat_mode = off
